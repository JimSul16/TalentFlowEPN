<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e56d0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2b6b;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="400" fill="url(#grad)" rx="20"/>
  <rect width="1200" height="400" fill="url(#grid)" rx="20"/>
  
  <!-- Icon / Logo Graphic -->
  <g transform="translate(100, 120)">
    <circle cx="80" cy="80" r="70" fill="#ffffff" fill-opacity="0.15" />
    <path d="M 60 55 C 60 45, 100 45, 100 55 C 100 75, 60 75, 60 95 L 100 95" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="80" cy="115" r="5" fill="#ffffff"/>
  </g>
  
  <!-- Text -->
  <text x="280" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-1">TalentFlow</text>
  <text x="280" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#93c5fd">Sistema Empresarial de Registro de Hojas de Vida</text>
  <text x="280" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="300" fill="#cbd5e1">Ionic 8 • Angular 22 Standalone • Firebase Firestore • Android APK</text>
</svg>
